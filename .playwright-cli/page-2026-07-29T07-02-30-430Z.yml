          - row [ref=f1e205]:
            - rowheader "x-content-type-options" [ref=f1e206]
            - cell [ref=f1e207]:
              - link "X-Content-Type-Options" [ref=f1e208] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/hardening-your-http-response-headers/#x-content-type-options
              - text: "stops a browser from trying to MIME-sniff the content type and forces it to stick with the declared content-type. The only valid value for this header is \"X-Content-Type-Options: nosniff\"."
          - row [ref=f1e209]:
            - rowheader "x-frame-options" [ref=f1e210]
            - cell [ref=f1e211]:
              - link "X-Frame-Options" [ref=f1e212] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/hardening-your-http-response-headers/#x-frame-options
              - text: tells the browser whether you want to allow your site to be framed or not. By preventing a browser from framing your site you can defend against attacks like clickjacking.
          - row [ref=f1e213]:
            - rowheader "x-frame-options" [ref=f1e214]
            - cell [ref=f1e215]:
              - link "X-Frame-Options" [ref=f1e216] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/hardening-your-http-response-headers/#x-frame-options
              - text: tells the browser whether you want to allow your site to be framed or not. By preventing a browser from framing your site you can defend against attacks like clickjacking.
          - row [ref=f1e217]:
            - rowheader "access-control-allow-origin" [ref=f1e218]
            - cell "The Access-Control-Allow-Origin header is used to configure CORS." [ref=f1e219]
          - row [ref=f1e220]:
            - rowheader "x-xss-protection" [ref=f1e221]
            - cell [ref=f1e222]:
              - link "X-XSS-Protection" [ref=f1e223] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/hardening-your-http-response-headers/#x-xss-protection
              - text: "sets the configuration for the XSS Auditor built into older browsers. The recommended value was \"X-XSS-Protection: 1; mode=block\" but you should now look at"
              - link "Content Security Policy" [ref=f1e224] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/content-security-policy-an-introduction/
              - text: instead.
          - row [ref=f1e225]:
            - rowheader "strict-transport-security" [ref=f1e226]
            - cell [ref=f1e227]:
              - link "HTTP Strict Transport Security" [ref=f1e228] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/hsts-the-missing-link-in-tls/
              - text: is an excellent feature to support on your site and strengthens your implementation of TLS by getting the User Agent to enforce the use of HTTPS.
          - row [ref=f1e229]:
            - rowheader "content-security-policy" [ref=f1e230]
            - cell [ref=f1e231]:
              - link "Content Security Policy" [ref=f1e232] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/content-security-policy-an-introduction/
              - text: is an effective measure to protect your site from XSS attacks. By whitelisting sources of approved content, you can prevent the browser from loading malicious assets.
              - link "Analyse" [ref=f1e233] [cursor=pointer]:
                - /url: https://report-uri.com/home/analyse/https%3A%2F%2Fwww.mimosa.co.zw%2F
              - text: this policy in more detail. You can sign up for a free account on
              - link "Report URI" [ref=f1e234] [cursor=pointer]:
                - /url: https://report-uri.com
              - text: to collect reports about problems on your site.
          - row [ref=f1e235]:
            - rowheader "referrer-policy" [ref=f1e236]
            - cell [ref=f1e237]:
              - link "Referrer Policy" [ref=f1e238] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/a-new-security-header-referrer-policy/
              - text: is a new header that allows a site to control how much information the browser includes with navigations away from a document and should be set by all sites.
          - row [ref=f1e239]:
            - rowheader "permissions-policy" [ref=f1e240]
            - cell [ref=f1e241]:
              - link "Permissions Policy" [ref=f1e242] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/goodbye-feature-policy-and-hello-permissions-policy/
              - text: is a new header that allows a site to control which features and APIs can be used in the browser.
          - row [ref=f1e243]:
            - rowheader "cross-origin-resource-policy" [ref=f1e244]
            - cell [ref=f1e245]:
              - link "Cross-Origin Resource Policy" [ref=f1e246] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/coop-and-coep/
              - text: allows a resource owner to specify who can load the resource.
          - row [ref=f1e247]:
            - rowheader "cross-origin-embedder-policy" [ref=f1e248]
            - cell [ref=f1e249]:
              - link "Cross-Origin Embedder Policy" [ref=f1e250] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/coop-and-coep/
              - text: allows a site to prevent assets being loaded that do not grant permission to load them via CORS or CORP.
          - row [ref=f1e251]:
            - rowheader "cross-origin-opener-policy" [ref=f1e252]
            - cell [ref=f1e253]:
              - link "Cross-Origin Opener Policy" [ref=f1e254] [cursor=pointer]:
                - /url: https://scotthelme.co.uk/coop-and-coep/
              - text: allows a site to opt-in to Cross-Origin Isolation in the browser.
