    - generic [ref=e117]:
      - heading "Why use a website checker?" [level=3] [ref=e118]
      - paragraph [ref=e119]: Regularly monitoring your site for malware and indicators of compromise can help you keep tabs on your website’s security and focus your perspective to identify security related issues. Quick response to threats help maintain SEO rankings, organic traffic, brand reputation, and protect website visitors from harm.
    - generic [ref=e121]:
      - heading "How to check if a website is safe." [level=3] [ref=e122]
      - paragraph [ref=e123]: Scanning a website’s source code for malicious links, redirects, iframes, JavaScript, or spam can help you determine if a website is not safe to use. Run a web safety check with SiteCheck to scan for any viruses or malware for a specific URL. A quick remote malware scan can help you pinpoint any configuration issues or security anomalies at the client level.
    - generic [ref=e125]:
      - heading "About Sucuri" [level=3] [ref=e126]
      - heading "What is Sucuri SiteCheck?" [level=4] [ref=e127]
      - paragraph [ref=e128]: The SiteCheck scanner remotely checks any URL for security threats, malware, defacements, out-of-date CMS, blacklisting, and other important security issues. It visits a website like an everyday user would to verify the source code for malicious behavior or security anomalies.
      - paragraph [ref=e129]:
        - text: Since the remote scanner only has access to what’s visible on the browser level, it will not detect anything on the server-side. To scan every file in a website’s directory and detect phishing pages, backdoors, mailers, DoS scripts or any other malware at the server level enable the
        - link "Sucuri Platform." [ref=e130] [cursor=pointer]:
          - /url: https://sucuri.net/website-security-platform/
      - heading "Is Sucuri SiteCheck safe?" [level=4] [ref=e131]
      - paragraph [ref=e132]: SiteCheck helps millions of webmasters every year by providing free remote website scanning for security issues. Sucuri’s SiteCheck monitoring is powered by a highly technical team of security professionals distributed around the world. Our trained security team is skilled at identifying issues and cleaning up hacked websites.
